# This workflow releases the project on Maven Central
# and prepare a new development version

name: Release to Maven Central
run-name: Release v${{ inputs.releaseVersion }} to Maven Central

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: "Release version"
        required: true
        default: ""
      developmentVersion:
        description: "New SNAPSHOT version"
        required: true
        default: ""

jobs:
  release:
    uses: metricshub/workflows/.github/workflows/maven-central-release.yml@v8
    with:
      releaseVersion: ${{ inputs.releaseVersion }}
      developmentVersion: ${{ inputs.developmentVersion }}
      autoRelease: true
      jdkVersion: "17"
    secrets: inherit

  # The shared release workflow uploads the versioned jars only. The version-less alias gives the installers of the
  # documentation site (src/site/resources/get and get.ps1) a stable download URL
  # (releases/latest/download/ipmi-java-standalone.jar), and the .sha256 files let them verify the download.
  standalone-assets:
    name: Upload the standalone jar alias and checksums
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Upload ipmi-java-standalone.jar and the SHA-256 checksums to v${{ inputs.releaseVersion }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.releaseVersion }}
        run: |
          jar="ipmi-java-${RELEASE_VERSION}-standalone.jar"
          gh release download "v${RELEASE_VERSION}" --pattern "${jar}"
          cp "${jar}" ipmi-java-standalone.jar
          sha256sum "${jar}" > "${jar}.sha256"
          sha256sum ipmi-java-standalone.jar > ipmi-java-standalone.jar.sha256
          gh release upload "v${RELEASE_VERSION}" --clobber \
            ipmi-java-standalone.jar "${jar}.sha256" ipmi-java-standalone.jar.sha256
